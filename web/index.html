<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Título e descrição de verdade são escritos por `src/site/seo.js` depois
      que a vitrine responde, com o nome, os serviços e a cidade da empresa —
      um HTML só serve a todas elas, então aqui só pode morar o neutro. O que
      está abaixo é o que aparece enquanto a resposta não chega.
    -->
    <meta name="description" content="Agende seu horário online, com confirmação na hora." />
    <title>Agende seu horário</title>
  </head>
  <body>
    <!--
      Contrato de direção — modelo Clínica (site), redesenho de set/2026.
      THESIS: um estúdio de cuidado apresentado como uma casa, não uma loja —
        creme, o verde da empresa e um fio de dourado; recusa o branco clínico
        anterior e o "cartão de serviço" genérico.
      OWN-WORLD: papel creme #F7F5ED com granulado a 3,5%; --marca-escura como
        faixa do hero e do rodapé, --marca-clara como faixa dos serviços, bege
        #E8DFCD na faixa "Agende"; dourado do modelo (#7A5C2A texto, #E8CF91
        fio/anel/botão); Manrope leve em títulos gigantes com UMA palavra em
        Instrument Serif itálico; olho-de-seção com fio dourado; botões-pílula
        em caixa-alta espaçada; retrato em arco, em cor natural (a cliente
        recusou o tingido da referência).
      STORY: quem chega entende em segundos que é um lugar de cuidado com nome
        e rosto, vê os serviços, e marca hora de verdade (sem cadastro) — o
        agendamento é o produto, não um formulário.
      FIRST VIEWPORT: faixa escura da marca; à esquerda o slogan como olho, o
        nome da empresa em ~6vw com a última palavra em itálico dourado, uma
        frase do "sobre", botão dourado "Agende seu horário" + link "Conheça os
        serviços"; à direita o retrato em arco com anel dourado deslocado e um
        selo flutuante ("Hora marcada online"); curva creme fecha a faixa.
      FORM: direção fixada pela cliente (pasta Exemplo/), sem sorteio de
        conceito — brief fixado vence o roll; conteúdo inventado da
        referência (depoimentos, nota, anos) deixado de fora.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
        the finish review, the verdict, DESIGN.md, and every shipping raster
        carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/site/main.jsx"></script>
  </body>
</html>
